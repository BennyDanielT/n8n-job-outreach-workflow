# Master resume: the single source of truth for tailoring.
# Every bullet has a stable id. Tailored bullets must cite the ids they came from, and the
# faithfulness checks reject anything that cannot be traced back here.
#
# Add MORE than fits on a page. Bullets with `in_base: false` are left out of your base resume
# but the tailor can still pick them when a job calls for them.
# **double asterisks** make text bold, as \textbf does in the LaTeX version.

layout:
  # Reproduces the LaTeX template: no summary, Projects after Technical Skills.
  section_order: [summary, experience, education, skills, projects, certifications]
  show_headline: false
  show_summary: false
  show_role_skills: true
  max_project_tech: 4
  max_pages: 1

