# Add named volume for Chrome profile persistence
volumes:
  linkedin_chrome_profile:
  n8n_data:

networks:
  appnet:
    driver: bridge

version: '3.8'

services:
  linkedin-scraper:
    build: .
    container_name: linkedin-job-scraper
    ports:
      - '5000:5000'
    volumes:
      - ./app.py:/app/app.py
      - ./linkedin_functions.py:/app/linkedin_functions.py
      - ./.env:/app/.env
      - linkedin_chrome_profile:/home/appuser/SeleniumProfile
    environment:
      - LINKEDIN_EMAIL=${LINKEDIN_EMAIL}
      - LINKEDIN_PASSWORD=${LINKEDIN_PASSWORD}
      - PORT=5000
    command: uvicorn app:app --host 0.0.0.0 --port 5000 --reload
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import requests; requests.get('http://localhost:5000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    shm_size: 2g
    networks:
      - appnet

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok-tunnel
    restart: unless-stopped
    command:
      - 'start'
      - '--all'
      - '--config'
      - '/etc/ngrok.yml'
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
    ports:
      - '4040:4040' # ngrok web interface
    depends_on:
      - linkedin-scraper
    networks:
      - appnet

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg-pdf
    restart: always
    ports:
      - '3000:3000'
    environment:
      - GOTENBERG_API_TIMEOUT=30s
      - GOTENBERG_API_PORT=3000
      - GOTENBERG_LOG_LEVEL=info
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - appnet

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - '5678:5678'
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Europe/London
    networks:
      - appnet
    volumes:
      - n8n_data:/home/node/.n8n
