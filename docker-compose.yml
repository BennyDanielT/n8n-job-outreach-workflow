services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      GOTENBERG_URL: http://gotenberg:3000
      PDF_ENGINE: gotenberg
      DATABASE_URL: sqlite:////app/data/copilot.db
      CHROME_PROFILE_DIR: /home/appuser/chrome-profile
    volumes:
      # The tracker database and your master resume stay on your machine, not in the container.
      - ./data:/app/data
      - chrome_profile:/home/appuser/chrome-profile
    shm_size: 2g        # Chromium needs more shared memory than Docker's default
    depends_on:
      gotenberg:
        condition: service_healthy
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    # Internal only: the API is its only client.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional n8n editor, for scheduled searches or outreach flows that call this API.
  # Start it with: docker compose --profile n8n up
  n8n:
    image: n8nio/n8n:latest
    profiles: ["n8n"]
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: America/Halifax
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  chrome_profile:
  n8n_data:
